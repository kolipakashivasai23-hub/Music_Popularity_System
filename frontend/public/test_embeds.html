<!DOCTYPE html>
<html>
<head>
  <title>YouTube Embed Tester 2</title>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid #334155; }
    h3 { margin: 0 0 8px 0; font-size: 13px; font-weight: bold; color: #38bdf8; }
    iframe { width: 100%; height: 160px; border: none; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Testing Global Hits YouTube Embeds</h2>
  <div class="grid" id="container"></div>

  <script>
    const candidates = [
      { name: "1. Kesariya (Hindi)", id: "BddP6PYo2gs" },
      { name: "2. Blinding Lights (English)", id: "4NRXx6U8ABQ" },
      { name: "3. Shape of You", id: "JGwWNGJdvx8" },
      { name: "4. Levitating", id: "TUVcZfQe-Kw" },
      { name: "5. Uptown Funk", id: "OPf0YbXqDm0" },
      { name: "6. Counting Stars", id: "hT_nvWreIhg" },
      { name: "7. Sugar", id: "09R8_2nJtjg" },
      { name: "8. Starboy", id: "34Na4j8AVgA" },
      { name: "9. See You Again", id: "RgKAFK5djSk" },
      { name: "10. Closer", id: "PT2_F-1esPk" },
      { name: "11. Senorita", id: "Pkh8UtuejGw" },
      { name: "12. Stay", id: "KTZ-y85Erus" },
      { name: "13. Cheap Thrills", id: "nYh-n7EOtMA" },
      { name: "14. Believer", id: "7wtfhZwyrYY" }
    ];

    const container = document.getElementById('container');
    candidates.forEach(c => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `<h3>${c.name} [${c.id}]</h3>
        <iframe src="https://www.youtube-nocookie.com/embed/${c.id}?start=30&end=45" allow="autoplay; encrypted-media"></iframe>`;
      container.appendChild(div);
    });
  </script>
</body>
</html>
