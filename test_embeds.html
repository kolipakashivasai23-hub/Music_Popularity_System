<!DOCTYPE html>
<html>
<head>
  <title>YouTube Embed Permissions Tester</title>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid #334155; }
    h3 { margin: 0 0 8px 0; font-size: 13px; font-weight: bold; color: #38bdf8; }
    iframe { width: 100%; height: 160px; border: none; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>YouTube Embed Permissions Tester</h2>
  <div class="grid" id="container"></div>

  <script>
    const candidates = [
      { name: "Telugu 1: Samajavaragamana (Lyrical)", id: "tflQ33g6I8I" },
      { name: "Telugu 1: Samajavaragamana (Song)", id: "Thf60JU8E98" },
      { name: "Telugu 1: Samajavaragamana (4K)", id: "OCg6BWlAXSw" },
      { name: "Telugu 1: Samajavaragamana (Cover)", id: "nKpTCjN_c_A" },
      { name: "Telugu 1: Ramuloo Ramulaa (Video)", id: "Bg8Yb9zGYyA" },
      { name: "Telugu 1: Ramuloo Ramulaa (Full)", id: "wFAj0pW6xX0" },
      { name: "Telugu 2: Srivalli (Video)", id: "txHO7PLGE3o" },
      { name: "Telugu 2: Srivalli (Lyrical)", id: "5IEbR79kBPY" },
      { name: "Telugu 2: Srivalli (Lyrics)", id: "6S9PGMNTlQ8" },
      { name: "Telugu 2: Oo Antava (Full)", id: "u_wB6byrl5k" },
      { name: "Telugu 2: Chuttamalle (Devara)", id: "GWNrPJyRTcA" },
      { name: "Hindi 1: Kesariya (Official)", id: "BddP6PYo2gs" },
      { name: "Hindi 1: Kesariya (Lyrics)", id: "W1S9AbHpWFY" },
      { name: "Hindi 2: Chaleya (Official)", id: "VAdGW7QDJiU" },
      { name: "Hindi 2: Chaleya (Lyrics)", id: "Bi7sSC046dk" },
      { name: "Hindi 2: Apna Bana Le (Official)", id: "ElZfdU54Cp8" },
      { name: "Hindi 2: Apna Bana Le (Lyrics)", id: "PYLxgPKtzZE" },
      { name: "Hindi 2: Raataan Lambiyan", id: "gvyUuxdRdR4" },
      { name: "Hindi 2: Tum Hi Ho", id: "IJq0yyWug1k" },
      { name: "English 1: Blinding Lights", id: "4NRXx6U8ABQ" }
    ];

    const container = document.getElementById('container');
    candidates.forEach(c => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `<h3>${c.name} [${c.id}]</h3>
        <iframe src="https://www.youtube-nocookie.com/embed/${c.id}?start=30&end=45&autoplay=0" allow="autoplay"></iframe>`;
      container.appendChild(div);
    });
  </script>
</body>
</html>
